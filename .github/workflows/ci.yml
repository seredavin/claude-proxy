name: ci

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон — очередь не копится.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Форматирование, vet и тесты
        run: make check

      - name: Гонки
        run: go test -race ./...

      - name: Сборка под все платформы релиза
        run: make dist
